inherits: base.yaml

# Shared base for all Ollama local model runs.
# Switch model by setting llm.model (e.g. "qwen3.5:2b", "llama3.2:3b").

llm:
  provider: "ollama"
  model: "deepseek-r1:7b"
  base_url: "http://localhost:11434/v1"
  think: false  # disable extended thinking (qwen3 and similar models)
  temperature: 0.0
  max_tokens: 1024

# BM25 keeps runs fully local — no OpenAI embedding calls needed.
# Switch to dense/hybrid if you also have an embedding model in Ollama.
retrieval:
  method: "bm25"

experiment:
  output_dir: "results/ollama"

data:
  subset_size: 100
